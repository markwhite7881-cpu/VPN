name: release-macos

# Build unsigned .app + .dmg for macOS on every push to the
# linux/macos-build branch, plus on tag pushes (so we can also
# cut a release from a tag). Build for both Apple Silicon
# (aarch64-apple-darwin) and Intel (x86_64-apple-darwin) in
# parallel — the user picks the right .dmg for their Mac.
#
# We tried `universal-apple-darwin` first (one .dmg for both
# arches via lipo), but `dtolnay/rust-toolchain@stable` doesn't
# accept the virtual target triple, and Tauri 2's "universal"
# target still needs both arch toolchains anyway. Two .dmgs is
# the cleanest path until/unless we add code-signing.
#
# Outputs (uploaded as workflow artifacts):
#   - Cloakwire_<ver>_aarch64.dmg
#   - Cloakwire_<ver>_x64.dmg
#
# Not signed / not notarized. Users have to "Open Anyway" once
# from System Settings → Privacy & Security. Add signing later
# by adding APPLE_CERT_P12_BASE64 + APPLE_CERT_PASSWORD secrets
# and a notarytool step.

on:
  push:
    branches:
      - linux/macos-build
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            triple: aarch64-apple-darwin
            arch_label: aarch64
          - target: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            triple: x86_64-apple-darwin
            arch_label: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build sing-box from SagerNet source with custom tags
        # The SagerNet release tarballs do NOT include the
        # `with_xhttp` build tag (we confirmed empirically: 1.14.0-beta.14
        # rejects `transport: "xhttp"` as `unknown field`). The xhttp
        # VLESS transport IS in the SagerNet source — it just isn't
        # included in their official release CI. The Windows sidecar
        # we currently ship (sing-box version 1.14.0-lx.24) was a
        # hand-built SagerNet source build with `with_xhttp` and a few
        # other custom tags, so we mirror that here for macOS.
        # CGO_ENABLED=0 → no Apple-specific HTTP/TLS engine (those
        # need osxcross); we get a portable, cross-compiled binary
        # that still speaks xhttp (which is pure-Go in sing-box).
        run: |
          set -e
          go install github.com/sagernet/sing-box/cmd/sing-box@latest
          BUILD_TAGS="with_xhttp with_awg with_quic with_wireguard with_utls with_clash_api with_naive_outbound"
          go build \
            -tags "$BUILD_TAGS" \
            -trimpath \
            -ldflags "-s -w -buildid=" \
            -o "src-tauri/binaries/sing-box-${{ matrix.triple }}" \
            ./cmd/sing-box
          chmod +x "src-tauri/binaries/sing-box-${{ matrix.triple }}"
          ./src-tauri/binaries/sing-box-${{ matrix.triple }} version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-${{ matrix.target }}-

      - name: Install build dependencies
        # create-dmg is what Tauri 2 uses under the hood to produce
        # the .dmg from the .app bundle. It's not preinstalled on
        # the runner image (was preinstalled on older versions but
        # Apple Silicon runners dropped it).
        run: |
          brew install create-dmg

      - name: Install JS deps
        run: npm ci

      - name: Build Tauri bundle
        # --bundles app,dmg produces both the .app (drag-to-Applications)
        # and the .dmg (mount + drag). Tauri 2 picks the right
        # sing-box sidecar from binaries/ based on the --target triple.
        run: |
          npm run tauri:build -- --target ${{ matrix.target }} --bundles app,dmg
        env:
          NO_STRIP: "true"

      - name: Rename DMG
        id: rename
        run: |
          # Tauri 2 emits the .dmg at
          # src-tauri/target/<target>/release/bundle/dmg/Cloakwire_<ver>_<arch>.dmg.
          # We just rename it to a stable name for the artifact.
          set -e
          src_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          if [ ! -d "$src_dir" ]; then
            src_dir="src-tauri/target/release/bundle/dmg"
          fi
          src=$(ls -1 "$src_dir"/*.dmg | head -1)
          ver=$(echo "$src" | sed -nE 's/.*_([0-9]+\.[0-9]+\.[0-9]+).*\.dmg/\1/p')
          if [ -z "$ver" ]; then
            ver="0.0.0"
          fi
          dst="dist/Cloakwire_${ver}_${{ matrix.arch_label }}.dmg"
          mkdir -p dist
          mv "$src" "$dst"
          echo "dst=$dst" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloakwire-macos-${{ matrix.arch_label }}
          path: ${{ steps.rename.outputs.dst }}
          if-no-files-found: error
          retention-days: 14

  # Combine the per-arch .dmgs into a "ready to upload" bundle
  # that downstream `gh release upload` can download in one shot.
  publish-ready:
    name: collect artifacts
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List
        run: ls -la dist/cloakwire-macos-*/

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloakwire-macos-all
          path: dist/cloakwire-macos-*/
          retention-days: 14
