name: release-macos

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: macOS (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            goarch: arm64
            label: aarch64
          - target: x86_64-apple-darwin
            goarch: amd64
            label: x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.0.0
        with:
          go-version: '1.25.5'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build pinned sing-box sidecar
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/sing-box-src
          cd /tmp/sing-box-src
          git remote add origin https://github.com/Leadaxe/sing-box-lx.git
          git fetch --depth 1 origin 9558ceb27bc1e92e2ecfa96ebfe6b3f688344c5a
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          CGO_ENABLED=1 GOOS=darwin GOARCH='${{ matrix.goarch }}' go build \
            -tags 'with_xhttp with_awg with_quic with_wireguard with_utls with_clash_api with_naive_outbound with_lx_command' \
            -trimpath -ldflags '-s -w -buildid=' \
            -o "$GITHUB_WORKSPACE/src-tauri/binaries/sing-box-${{ matrix.target }}" \
            ./cmd/sing-box
          chmod +x "$GITHUB_WORKSPACE/src-tauri/binaries/sing-box-${{ matrix.target }}"
          "$GITHUB_WORKSPACE/src-tauri/binaries/sing-box-${{ matrix.target }}" version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build app and DMG
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles app,dmg
        env:
          NO_STRIP: 'true'

      - name: Collect only exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          app_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          dmgs=()
          while IFS= read -r path; do dmgs+=("$path"); done < <(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg')
          apps=()
          while IFS= read -r path; do apps+=("$path"); done < <(find "$app_dir" -maxdepth 1 -type d -name '*.app')
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::Expected exactly one DMG in $dmg_dir; found ${#dmgs[@]}"; exit 1; }
          [ "${#apps[@]}" -eq 1 ] || { echo "::error::Expected exactly one app bundle in $app_dir; found ${#apps[@]}"; exit 1; }
          mkdir -p dist
          cp "${dmgs[0]}" "dist/Cloakwire_${version}_${{ matrix.label }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" "dist/Cloakwire_${version}_${{ matrix.label }}.app.zip"
          shasum -a 256 dist/* > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloakwire-macos-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
