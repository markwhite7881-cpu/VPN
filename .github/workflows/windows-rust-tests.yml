name: windows-rust-tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hwid-xray-subscriptions

permissions:
  contents: read

jobs:
  test:
    name: Windows Rust library tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Create test-only externalBin resource placeholders
        shell: pwsh
        run: |
          $sidecars = @(
            'sing-box-x86_64-pc-windows-msvc.exe',
            'xray-x86_64-pc-windows-msvc.exe'
          )
          foreach ($sidecar in $sidecars) {
            New-Item -ItemType File -Force -Path "src-tauri/binaries/$sidecar"
          }

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Compile Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --no-run

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture

      - name: Check working tree diff
        shell: pwsh
        run: git diff --check
