name: windows-rust-tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hwid-xray-subscriptions

permissions:
  contents: read

jobs:
  test:
    name: Windows Rust library tests
    # CI diagnostic: isolate the native loader boundary from the Windows Server 2025 image.
    runs-on: windows-2022
    env:
      CLOAKWIRE_TEST_MANIFEST: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Create test-only Tauri resource placeholders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $sidecars = @(
            'sing-box-x86_64-pc-windows-msvc.exe',
            'xray-x86_64-pc-windows-msvc.exe'
          )
          foreach ($sidecar in $sidecars) {
            New-Item -ItemType File -Force -Path "src-tauri/binaries/$sidecar"
          }

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Compile Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --no-run

      - name: Run Rust library tests and capture Windows loader diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $test = Get-ChildItem -Path 'src-tauri\target\debug\deps' `
            -Filter 'cloakwire_lib-*.exe' -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $test) {
            throw 'Could not locate src-tauri\target\debug\deps\cloakwire_lib-*.exe after cargo test --no-run.'
          }

          Write-Host "Launching test binary: $($test.Name)"
          $started = (Get-Date).ToUniversalTime()
          $cdb = Get-Command cdb.exe -ErrorAction SilentlyContinue
          $sanitize = {
            param([string] $line)
            $line = $line -replace '(?i)(?:[a-z]:\\|\\\\)[^\s"'']*\\([^\\\s"'']+\.dll)\b', '<path>\\$1'
            $line = $line -replace '(?i)(?:[a-z]:\\|\\\\)[^\s"'']*', '<path>'
            $line = $line -replace '(?i)https?://[^\s"'']+', '<url>'
            $line = $line -replace '\b(?:\d{1,3}\.){3}\d{1,3}(?::\d{1,5})?\b', '<endpoint>'
            $line -replace '(?i)\b(token|hwid|uuid|config(?:uration)?|subscription|server)\S*', '<redacted>'
          }
          $loaderLine = {
            param([string] $line)
            $line -match '(?i)(entry point|procedure|module|dll|STATUS_ENTRYPOINT_NOT_FOUND|0xc0000139)'
          }

          if ($cdb) {
            Write-Host 'CDB is available; launching one diagnostic copy under a temporary debugger.'
            $transcript = & $cdb.Source -g -G -c 'g; q' $test.FullName --nocapture 2>&1

            $safeLines = $transcript |
              ForEach-Object { & $sanitize $_.ToString() } |
              Where-Object { & $loaderLine $_ } |
              Select-Object -Unique

            Write-Host '--- CDB loader diagnostic (sanitized) ---'
            if ($safeLines) {
              $safeLines | ForEach-Object { Write-Host $_ }
            }
            else {
              Write-Host 'No sanitized loader identity was emitted by CDB.'
            }
            Write-Host '--- End CDB loader diagnostic ---'
          }
          else {
            Write-Warning 'cdb.exe is not installed on this runner; skipped the debugger diagnostic.'
          }

          # Run the real test invocation separately so the job always preserves its exact exit code.
          $testOutput = & $test.FullName --nocapture 2>&1
          $testExit = $LASTEXITCODE
          Write-Host "Test binary exit code: $testExit"

          if (Get-Command Get-WinEvent -ErrorAction SilentlyContinue) {
            $namePattern = [regex]::Escape($test.Name)
            $stemPattern = [regex]::Escape($test.BaseName)

            $events = foreach ($log in 'System', 'Application') {
              try {
                Get-WinEvent -FilterHashtable @{
                  LogName   = $log
                  StartTime = $started.AddSeconds(-5)
                } -MaxEvents 200 |
                  Where-Object {
                    $_.Id -eq 26 -or
                    $_.ProviderName -in 'Application Error', 'Windows Error Reporting'
                  }
              }
              catch {
                Write-Warning "Could not read $log event log: $($_.Exception.Message)"
              }
            }

            $matching = $events |
              Where-Object {
                $_.Message -match $namePattern -or $_.Message -match $stemPattern
              } |
              Sort-Object TimeCreated -Descending -Unique

            if ($matching) {
              $eventLines = $matching |
                Format-List TimeCreated, LogName, ProviderName, Id, LevelDisplayName, Message |
                Out-String -Width 240 |
                ForEach-Object { $_ -split "`r?`n" } |
                ForEach-Object { & $sanitize $_ } |
                Where-Object { & $loaderLine $_ } |
                Select-Object -Unique

              Write-Host '--- Windows launch diagnostic (sanitized) ---'
              if ($eventLines) {
                $eventLines | ForEach-Object { Write-Host $_ }
              }
              else {
                Write-Host 'No sanitized loader identity was present in matching event-log records.'
              }
              Write-Host '--- End Windows launch diagnostic ---'
            }
            else {
              Write-Warning 'No matching Windows Application Popup / WER event was found. The runner did not expose the loader message in its event logs.'
            }
          }
          else {
            Write-Warning 'Get-WinEvent is unavailable; skipped Windows event-log diagnostic.'
          }

          exit $testExit

      - name: Check working tree diff
        shell: pwsh
        run: git diff --check
