name: windows-rust-tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hwid-xray-subscriptions

permissions:
  contents: read

jobs:
  test:
    name: Windows Rust library tests
    # CI diagnostic: isolate the native loader boundary from the Windows Server 2025 image.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Create test-only Tauri resource placeholders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $sidecars = @(
            'sing-box-x86_64-pc-windows-msvc.exe',
            'xray-x86_64-pc-windows-msvc.exe'
          )
          foreach ($sidecar in $sidecars) {
            New-Item -ItemType File -Force -Path "src-tauri/binaries/$sidecar"
          }

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Compile Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --no-run

      - name: Run Rust library tests and capture Windows loader diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $test = Get-ChildItem -Path 'src-tauri\target\debug\deps' `
            -Filter 'cloakwire_lib-*.exe' -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $test) {
            throw 'Could not locate src-tauri\target\debug\deps\cloakwire_lib-*.exe after cargo test --no-run.'
          }

          Write-Host "Launching test binary: $($test.FullName)"
          $started = (Get-Date).ToUniversalTime()

          & $test.FullName --nocapture
          $testExit = $LASTEXITCODE

          if (Get-Command Get-WinEvent -ErrorAction SilentlyContinue) {
            $namePattern = [regex]::Escape($test.Name)
            $stemPattern = [regex]::Escape($test.BaseName)

            $events = foreach ($log in 'System', 'Application') {
              try {
                Get-WinEvent -FilterHashtable @{
                  LogName   = $log
                  StartTime = $started.AddSeconds(-5)
                } -MaxEvents 200 |
                  Where-Object {
                    $_.Id -eq 26 -or
                    $_.ProviderName -in 'Application Error', 'Windows Error Reporting'
                  }
              }
              catch {
                Write-Warning "Could not read $log event log: $($_.Exception.Message)"
              }
            }

            $matching = $events |
              Where-Object {
                $_.Message -match $namePattern -or $_.Message -match $stemPattern
              } |
              Sort-Object TimeCreated -Descending -Unique

            if ($matching) {
              Write-Host '--- Windows launch diagnostic ---'
              $matching |
                Format-List TimeCreated, LogName, ProviderName, Id, LevelDisplayName, Message |
                Out-String -Width 240 |
                Write-Host
              Write-Host '--- End Windows launch diagnostic ---'
            }
            else {
              Write-Warning 'No matching Windows Application Popup / WER event was found. The runner did not expose the loader message in its event logs.'
            }
          }
          else {
            Write-Warning 'Get-WinEvent is unavailable; skipped Windows event-log diagnostic.'
          }

          exit $testExit

      - name: Check working tree diff
        shell: pwsh
        run: git diff --check
