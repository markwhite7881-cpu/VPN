[package]
name = "singbox-client"
version = "0.3.0"
description = "Cross-platform GUI VPN client built on top of sing-box"
authors = ["Alexey"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

# Default features.
#
# `custom-protocol` is what `tauri build` (via the tauri CLI) enables
# automatically. Without it, `tauri::is_dev()` returns `true` and the
# app opens the system browser to the `devUrl` instead of embedding
# the built `dist/` into the binary. Running `cargo build` directly
# (without `tauri build`) silently produces a 6.7 MB dev-mode exe
# that shows Edge pointing at `localhost:1420` with
# ERR_CONNECTION_REFUSED. Enabling `custom-protocol` by default here
# keeps `cargo build --release` and `tauri build` equivalent.
[features]
# This feature is used to enable the custom-protocol feature on the
# tauri crate, which makes the runtime embed the built `dist/` and
# NOT try to open the dev server. Tauri's CLI does this automatically
# (via `--features custom-protocol`); we set it as a default so that
# plain `cargo build --release` produces the same artifact.
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

# Avoid multiple binaries in the bundle
[[bin]]
name = "singbox-client"
path = "src/main.rs"

[lib]
name = "singbox_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# Auto-update for the app shell. Reads the manifest hosted on
# GitHub Releases (see tauri.conf.json > plugins.updater.endpoints)
# and applies signed updates. The matching npm package is
# @tauri-apps/plugin-updater (used by the frontend). The plugin
# requires a public key (in tauri.conf.json) and a private key
# (in the project root, see scripts/release.sh) generated via
# `npx tauri signer generate`.
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# Process management
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "time", "fs"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client (used by the Clash API module)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# WebSocket client (used by the traffic stream in Этап 5)
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# URL / encoding
percent-encoding = "2"
url = "2"
base64 = "0.22"

# Windows registry (used to set/clear the system HTTP/HTTPS proxy
# when sing-box is running in system_proxy mode so the rest of
# Windows actually sends traffic through 127.0.0.1:2080).
[target."cfg(windows)".dependencies]
winreg = "0.52"

# Process enumeration (used by the routing process-name picker to
# show currently-running executables the user can match against).
# Cross-platform — we only need name + pid, not Windows-specific
# extended process info, so no per-platform features required.
# `system` feature is required for Process / Pid / System.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[dev-dependencies]
# Used by the Этап 8 dry-run example to fetch a real subscription URL.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
